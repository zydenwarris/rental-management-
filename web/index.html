<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rental Management</title>
    <meta name="description" content="Landlord portal for managing properties, tenants, leases, and rent." />
    <script>
      // Runs before React mounts and before first paint, so a dark-mode reload
      // never flashes light. Kept inline and dependency-free for that reason.
      (function () {
        try {
          var stored = localStorage.getItem("rental.theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme = stored === "light" || stored === "dark" ? stored : prefersDark ? "dark" : "light";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (error) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
